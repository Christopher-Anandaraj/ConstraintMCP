[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "constraint-mcp"
version = "0.1.0"
description = "Hard enforcement for AI coding agents. SPEC.md rules that actually can't be broken."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "watchdog>=4.0.0",
    "markdown-it-py>=3.0.0",
]

[project.scripts]
constraint-mcp = "constraint_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
